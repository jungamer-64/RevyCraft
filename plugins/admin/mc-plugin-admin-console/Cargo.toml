[package]
name = "mc-plugin-admin-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Console admin surface plugin for the RevyCraft runtime host."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
disable-exported-symbols = []
in-process-testing = ["mc-plugin-sdk-rust/in-process-testing"]

[dependencies]
libc = "0.2"
mc-plugin-api = { path = "../../../crates/plugin/mc-plugin-api" }
mc-plugin-sdk-rust = { path = "../../../crates/plugin/mc-plugin-sdk-rust" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
