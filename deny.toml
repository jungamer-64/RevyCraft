[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
confidence-threshold = 0.8

