[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "bedrock-rs still pulls paste transitively and there is no maintained upgrade path available yet" },
    { id = "RUSTSEC-2026-0387", allow = ["elliptic-curve@=0.13.8"], reason = "bedrock-jwt uses this version to verify public signatures without private keys." },
]
unmaintained = "all"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/bedrock-crustaceans/bedrock-rs",
    "https://github.com/bedrock-crustaceans/nbtx",
]
