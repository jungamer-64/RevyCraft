name: Upgrade Runtime

on:
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "plugins/**"
      - "tools/xtask/**"
      - "runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/upgrade-runtime.yml"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "crates/**"
      - "plugins/**"
      - "tools/xtask/**"
      - "runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/upgrade-runtime.yml"
  release:
    types:
      - published
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p revy-server --test upgrade_runtime
      - run: cargo test -p revy-server-runtime core_reload_preserves_live_java_session
      - run: cargo test -p revy-server-runtime full_reload_preserves_live_java_session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-runtime-logs-linux
          path: target/upgrade-runtime-logs
          if-no-files-found: ignore

  windows-upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p revy-server --test upgrade_runtime
      - run: cargo test -p revy-server-runtime core_reload_preserves_live_java_session
      - run: cargo test -p revy-server-runtime full_reload_preserves_live_java_session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-runtime-logs-windows
          path: target/upgrade-runtime-logs
          if-no-files-found: ignore

  cutover-latency:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        operation:
          - reload
          - executable-upgrade
        mix:
          - name: java-1000
            test: production_cutover_latency_java_1000
          - name: bedrock-1000
            test: production_cutover_latency_bedrock_1000
          - name: mixed-500-500
            test: production_cutover_latency_mixed_500_500
        include:
          - os: ubuntu-latest
            operation: reload-artifacts
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
          - os: windows-latest
            operation: reload-artifacts
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
          - os: ubuntu-latest
            operation: reload-topology
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
          - os: windows-latest
            operation: reload-topology
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
          - os: ubuntu-latest
            operation: reload-core
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
          - os: windows-latest
            operation: reload-core
            mix: { name: mixed-500-500, test: production_cutover_latency_mixed_500_500 }
    env:
      REVY_CUTOVER_LATENCY_OPERATION: ${{ matrix.operation }}
      REVY_CUTOVER_LATENCY_TIER: ${{ github.event_name == 'pull_request' && 'pull-request' || 'acceptance' }}
      REVY_CUTOVER_LATENCY_ARTIFACT: ${{ github.workspace }}/target/cutover-latency-${{ matrix.mix.name }}-${{ matrix.operation }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure production cutover latency
        run: >-
          cargo test --release -p revy-server --test upgrade_runtime
          latency_cases::${{ matrix.mix.test }}
          -- --exact --ignored --nocapture
      - name: Enforce cutover latency budget
        run: >-
          cargo run -p xtask -- check-cutover-latency
          --input "${REVY_CUTOVER_LATENCY_ARTIFACT}"
          --tier "${REVY_CUTOVER_LATENCY_TIER}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutover-latency-${{ github.event_name }}-${{ matrix.os }}-${{ matrix.mix.name }}-${{ matrix.operation }}
          path: |
            ${{ env.REVY_CUTOVER_LATENCY_ARTIFACT }}
            target/upgrade-runtime-logs
          if-no-files-found: ignore
